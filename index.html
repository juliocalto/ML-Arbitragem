<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Arbitragem Brasil</title>
    <link rel="manifest" href="/manifest.json">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.10);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .dato {
            margin: 8px 0;
            font-size: 16px;
        }

        .semaforo {
            margin-top: 18px;
            padding: 14px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>ML Arbitragem Brasil</h1>

    <label>Buscar producto</label>

<div style="display:flex; gap:8px; align-items:center;">
    <input
        type="text"
        id="busquedaProducto"
        placeholder="Buscar en Mercado Livre"
        style="flex:1;"
    >

    <button
        type="button"
        onclick="abrirBusquedaFoto()"
        style="width:55px; font-size:24px;"
        title="Buscar por foto"
    >
        📷
    </button>
</div>

<button type="button" onclick="iniciarScanner()">
    Escanear código
</button>

<button type="button" onclick="document.getElementById('fotoProducto').click()">
    📷 Buscar con foto
</button>


<div id="scanner" style="margin-top:15px;"></div>
    <label>Costo de compra (R$)</label>
    <input
        type="number"
        id="precioCompra"
        step="0.01"
        placeholder="Ej: 6.00"
    >

    <label>ROI objetivo (%)</label>
    <input
        type="number"
        id="roiObjetivo"
        value="30"
    >
<label>Forma de envío</label>
<select id="tipo_envio">
    <option value="gratis">Envío gratis</option>
    <option value="cliente">El cliente paga el envío</option>
</select>
    <button onclick="analizarProducto()">
        Analizar producto
    </button>

    <div id="resultado"></div>

</div>

<script>

async function analizarProducto() {

    const busqueda = document.getElementById("busquedaProducto").value.trim();
    const precioCompra = document.getElementById("precioCompra").value;
    const roiObjetivo = document.getElementById("roiObjetivo").value;
const tipoEnvio = document.getElementById("tipo_envio").value;
    const resultado = document.getElementById("resultado");

    if (!busqueda || !precioCompra) {
        alert("Ingresa el producto y el costo de compra");
        return;
    }

    resultado.style.display = "block";
    resultado.innerHTML = "Analizando...";

    try {
const esEAN = /^\d{8,14}$/.test(busqueda);
const esProductId = /^MLB\d+$/i.test(busqueda);
const esAnalizable = esEAN || esProductId;

const url = esAnalizable
    ? `/analisis-ean/${busqueda}?precio_compra=${precioCompra}&listing_type_id=gold_special&tipo_envio=${tipoEnvio}&roi_objetivo=${roiObjetivo}`
    : `/buscar-producto?q=${encodeURIComponent(busqueda)}`;

const response = await fetch(url);
const data = await response.json();
if (!esAnalizable && data.status === "ok") {
    const resultados = data.resultados || [];

    if (resultados.length === 0) {
        resultado.innerHTML = `
            <h2>No se encontraron productos</h2>
            <p>Prueba con otra descripción más específica.</p>
        `;
        return;
    }

    resultado.innerHTML = `
        <h2>Productos encontrados</h2>
        ${resultados.map((p, i) => `
            <div
    onclick="seleccionarProducto('${p.id}', '${(p.name || "").replace(/'/g, "\\'")}')"
    style="padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; cursor:pointer;"
>
    <strong>${i + 1}. ${p.name || "Producto sin nombre"}</strong><br>
    ID: ${p.id || "No disponible"}
</div>
        `).join("")}
    `;
    return;
}
        if (data.status === "sin_precio") {
    resultado.innerHTML = `
        <h2>${data.producto || "Producto encontrado"}</h2>
        <p><strong>EAN:</strong> ${data.ean}</p>
        <p><strong>Publicaciones:</strong> ${data.total_publicaciones ?? 0}</p>
        <p><strong>Ranking ML:</strong> ${data.ranking ? "#" + data.ranking : "Fuera del Top 20"}</p>
        <p><strong>⚠️ ${data.mensaje}</strong></p>
        <p>No se puede calcular el ROI hasta obtener un precio real de Mercado Livre.</p>
    `;
    return;
}

if (data.status !== "ok") {
    resultado.innerHTML = data.mensaje || "No fue posible analizar el producto.";
    return;
}

        let claseSemaforo = "";

        if (data.semaforo === "COMPRAR") {
            claseSemaforo = "🟢";
        } else if (data.semaforo === "ANALIZAR") {
            claseSemaforo = "🟡";
        } else {
            claseSemaforo = "🔴";
        }

        resultado.innerHTML = `
            <h2>${data.producto || "Producto no encontrado en Mercado Livre"}</h2>

            <div class="dato">
                <strong>EAN:</strong> ${data.ean}
            </div>

            <div class="dato">
                <strong>Publicaciones:</strong>
                ${data.total_publicaciones ?? "No disponible"}
            </div>
            <div class="dato">
    <strong>Ranking ML:</strong>
    ${data.ranking ? "#" + data.ranking : "Fuera del Top 20"}
</div>

            <div class="dato">
                <strong>Precio ML referencia:</strong>
                R$ ${data.precio_venta_referencia ?? "No disponible"}
            </div>
            <div class="dato">
    <strong>Precio mínimo competencia:</strong>
    R$ ${data.precio_minimo_competencia ?? "No disponible"}
</div>

<div class="dato">
    <strong>Precio promedio competencia:</strong>
    R$ ${data.precio_promedio_competencia ?? "No disponible"}
</div>
<div class="dato">
    <strong>Precio recomendado:</strong>
    R$ ${data.precio_recomendado ?? "No disponible"}
</div>
<div class="dato">
    <strong>Posición competitiva:</strong>
    ${data.posicion_precio ?? "No disponible"} de ${data.total_publicaciones ?? "?"}
</div>
<div class="dato">
    <strong>Nivel de competitividad:</strong>
    ${data.nivel_competencia ?? "No disponible"}
</div>
            <div class="dato">
                <strong>Costo de compra:</strong>
                R$ ${data.precio_compra ?? "No disponible"}
            </div>
<div class="dato">
    <strong>Tarifa ML:</strong>
    R$ ${data.comision ?? "No disponible"}
</div>

<div class="dato">
    <strong>Envío ML:</strong>
    R$ ${data.costo_envio ?? "No disponible"}
</div>
            <div class="dato">
                <strong>Ganancia:</strong>
                R$ ${data.ganancia ?? "No disponible"}
            </div>

            <div class="dato">
                <strong>ROI:</strong>
                ${data.roi ?? "No disponible"}%
            </div>

            <div class="dato">
                <strong>Margen:</strong>
                ${data.margen ?? "No disponible"}%
            </div>

            <div class="dato">
                <strong>Costo máximo:</strong>
                R$ ${data.costo_maximo ?? "No disponible"}
            </div>

            <div class="semaforo">
                ${claseSemaforo} ${data.semaforo ?? "SIN RESULTADO"}
            </div>
        `;

    } catch (error) {

        resultado.innerHTML =
            "Error de conexión con el servidor.";

    }
}

function seleccionarProducto(productId, nombre) {
    document.getElementById("busquedaProducto").value = productId;
    analizarProducto();
}

</script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
let scannerActivo = false;
function abrirBusquedaFoto() {
    const inputFoto = document.createElement("input");

    inputFoto.type = "file";
    inputFoto.accept = "image/*";
    inputFoto.setAttribute("capture", "environment");

    inputFoto.onchange = function () {
        const foto = inputFoto.files[0];

        if (foto) {
            console.log("Foto seleccionada:", foto.name);
        }
    };

    inputFoto.click();
}
function iniciarScanner() {
    if (scannerActivo) {
        return;
    }

    scannerActivo = true;

    const scanner = new Html5Qrcode(
        "scanner",
        {
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E
            ],
            experimentalFeatures: {
                useBarCodeDetectorIfSupported: true
            },
            verbose: false
        }
    );

    const config = {
        fps: 20,
        qrbox: {
            width: 350,
            height: 180
        },
        aspectRatio: 1.777778,
        disableFlip: true
    };

    scanner.start(
        { facingMode: "environment" },
        config,
        (codigo) => {
            console.log("EAN detectado:", codigo);

            document.getElementById("busquedaProducto").value = codigo;

            scanner.stop().then(() => {
                scannerActivo = false;
                document.getElementById("scanner").innerHTML = "";
            });
        },
        (errorLectura) => {
    console.log("Intento de lectura:", errorLectura);
}
    ).catch((error) => {
        console.error("Error del escáner:", error);
        scannerActivo = false;
        alert("No fue posible iniciar el escáner.");
    });
}
document.getElementById("btn-foto").addEventListener("click", function () {
    document.getElementById("fotoProducto").click();
});

document.getElementById("fotoProducto").addEventListener("change", function () {
    const foto = this.files[0];

    if (foto) {
        const formData = new FormData();
        formData.append("foto", foto);
    fetch("/analizar-foto", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        console.log("Respuesta foto:", data);
        document.getElementById("producto").value = data.producto || "";
        alert("Producto detectado: " + (data.producto || "No identificado"));
    })
    .catch(error => {
        console.error(error);
        alert("Error al analizar la foto");
    });
}
});
</script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js")
        .then(() => console.log("App instalada correctamente"))
        .catch(error => console.log("Error Service Worker:", error));
}
</script>
</body>
</html>
